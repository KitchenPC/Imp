name: Publish NuGet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid version tag such as v0.1.0." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify project version
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/Imp/Imp.csproj -getProperty:Version -nologo)"
          if [[ "$project_version" != "${{ steps.version.outputs.value }}" ]]; then
            echo "Tag version '${{ steps.version.outputs.value }}' does not match project version '$project_version'." >&2
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore Imp.slnx

      - name: Test
        run: dotnet test Imp.slnx --configuration Release --no-restore

      - name: Pack
        run: >-
          dotnet pack src/Imp/Imp.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Verify package consumers
        run: ./eng/verify-package.sh ${{ steps.version.outputs.value }} artifacts

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: KitchenPC.Imp-${{ steps.version.outputs.value }}
          path: artifacts/*
          if-no-files-found: error

      - name: Sign in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >-
          dotnet nuget push
          artifacts/KitchenPC.Imp.${{ steps.version.outputs.value }}.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
