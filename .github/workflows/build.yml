name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Imp.slnx

      - name: Build
        run: dotnet build Imp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Imp.slnx --configuration Release --no-restore

      - name: Pack
        run: >-
          dotnet pack Imp.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=0.1.0-ci.${{ github.run_number }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: KitchenPC.Imp-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
